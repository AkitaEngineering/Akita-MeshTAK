[env:heltec_v3]
platform = platformio/espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/load_build_config.py

; Release dependencies are exact-pinned for reproducible builds. Update them only
; in a reviewed change that passes CI and hardware acceptance testing.
lib_deps =
  https://github.com/meshtastic/Meshtastic-arduino.git#77cdc035dbc3813c5f64efa24d20dcb698cdfc59
  heltecautomation/Heltec ESP32 Dev-Boards@2.1.5
  mikalhart/TinyGPSPlus@1.1.0
  knolleary/PubSubClient@2.8
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit GFX Library@1.12.6

build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D WIFI_LORA_32_V3
  -D HELTEC_BOARD=30
  -D SLOW_CLK_TPYE=0
  -D LoRaWAN_DEBUG_LEVEL=0

[env:heltec_v3_ci]
extends = env:heltec_v3
build_flags =
  ${env:heltec_v3.build_flags}
  -D ALLOW_PLACEHOLDER_SECRET
  -D ALLOW_UNWIRED_MESH_BRIDGE
