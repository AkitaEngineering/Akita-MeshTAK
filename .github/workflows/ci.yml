name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run static deployment checks
        run: |
          python3 tools/deployment_readiness_check.py
          python3 tools/validate_opentakserver_cot.py

      - name: Build firmware CI image
        run: platformio run -d firmware -e heltec_v3_ci

  atak-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AKITA_USE_ATAK_STUB: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform requirements
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Run plugin JVM tests with ATAK stubs
        working-directory: atak_plugin
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest -PakitaUseAtakStub=true

      - name: Run Android lint with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon lintDebug -PakitaUseAtakStub=true

      - name: Build plugin debug APK with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon assembleDebug -PakitaUseAtakStub=true

      - name: Verify debug APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(atak_plugin/build/outputs/apk/debug/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one debug APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi
          apk="${apks[0]}"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          "$bt/aapt2" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep -F "package: name='com.akitaengineering.meshtak'" /tmp/apk-badging.txt
          grep -E "versionName='[^']+'" /tmp/apk-badging.txt
          sha256sum -- "$apk" | tee atak_plugin/build/outputs/apk/debug/SHA256SUMS
          echo "Verified APK: $apk"

      - name: Upload debug APK (ATAK stubs, development only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AkitaMeshTAK-debug-stub-${{ github.run_number }}
          path: |
            atak_plugin/build/outputs/apk/debug/*.apk
            atak_plugin/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AkitaMeshTAK-reports-${{ github.run_number }}
          path: |
            atak_plugin/build/reports/tests/testDebugUnitTest/
            atak_plugin/build/test-results/testDebugUnitTest/*.xml
            atak_plugin/build/reports/lint-results-debug.*
          retention-days: 14
