name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run static deployment checks
        run: |
          python3 tools/deployment_readiness_check.py
          python3 tools/validate_opentakserver_cot.py

      - name: Build firmware CI image
        run: platformio run -d firmware -e heltec_v3_ci

  atak-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform requirements
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Run plugin JVM tests with ATAK stubs
        working-directory: atak_plugin
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test -PakitaUseAtakStub=true

      - name: Run Android lint with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon lintDebug -PakitaUseAtakStub=true

      - name: Build plugin debug artifact with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon assembleDebug -PakitaUseAtakStub=true
