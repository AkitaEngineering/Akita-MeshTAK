name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run static deployment checks
        run: |
          python3 tools/deployment_readiness_check.py
          python3 tools/validate_opentakserver_cot.py

      - name: Build firmware CI image
        run: platformio run -d firmware -e heltec_v3_ci

  atak-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android platform requirements
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Run plugin JVM tests with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon test -PakitaUseAtakStub=true

      - name: Run Android lint with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon lintDebug -PakitaUseAtakStub=true

      - name: Build plugin debug artifact with ATAK stubs
        working-directory: atak_plugin
        run: ./gradlew --no-daemon assembleDebug -PakitaUseAtakStub=true
